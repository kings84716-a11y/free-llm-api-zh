name: 每日实测更新

on:
  schedule:
    - cron: "0 1 * * *"   # UTC 01:00 = 北京 09:00
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 实测 + 生成站点
        env:
          # 可选：在 repo Settings → Secrets 配置后可做真实推理验证；不配置也会做无 key 探活
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_BASE: ${{ secrets.CF_API_BASE }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ] || [ -n "$GROQ_API_KEY" ]; then
            : > keys.env
            for v in OPENROUTER_API_KEY GROQ_API_KEY GEMINI_API_KEY NVIDIA_API_KEY CF_API_TOKEN CF_ACCOUNT_ID CF_API_BASE; do
              eval "val=\${$v:-}"; [ -n "$val" ] && echo "$v=$val" >> keys.env
            done
            chmod 600 keys.env
          fi
          bash scripts/run_daily.sh
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          if git diff --staged --quiet; then echo "今日无变化"; else git commit -m "chore: 每日实测 $(date -u +%F)"; git push; fi
